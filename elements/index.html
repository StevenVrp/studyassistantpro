<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Periodic table · Study Assistant Pro</title><link rel="icon" href="../Images/favicon.ico"><link rel="stylesheet" href="../assets/suite.css"><link rel="stylesheet" href="table.css"><link rel="stylesheet" href="orbitals.css"></head><body><div data-shell data-page="Periodic table" data-root="../"></div>
<main id="workspace" class="workspace"><div class="frame"><span class="eyebrow">Chemistry</span><h1 class="page-title">Periodic table</h1><p class="intro">Choose an element to explore its ground state, orbital shapes, and electron spins.</p>
<section class="panel" aria-label="Element explorer"><div class="filterbar"><label>Find an element<input type="search" id="search" autocomplete="off" placeholder="Name, symbol, or atomic number"></label><label>Table view<select id="mode"><option value="cat">Element family</option><option value="block">Electron block</option><option value="radius">Atomic radius (pm)</option><option value="en">Electronegativity (Pauling)</option><option value="ion">First ionization (kJ/mol)</option></select></label><label class="check"><input type="checkbox" id="exceptions"> Exceptions only</label></div>

<section id="details" class="panel" aria-label="Selected element"><div class="element-heading"><span id="symbol"></span><div><p class="eyebrow" id="category"></p><h2 id="name"></h2></div></div><div class="details-grid"><div id="properties"></div><div id="viewer"></div></div></section></div></main>
<script src="../assets/shell.js"></script><script src="data.js"></script><script src="orbitals.js"></script><script src="table.js"></script></body></html>
